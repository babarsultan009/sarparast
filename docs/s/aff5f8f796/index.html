<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Sarparast</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f1ea;color:#15233d;display:flex;min-height:90vh;align-items:center;justify-content:center;text-align:center;padding:16px}
.c{max-width:420px}h1{font-size:22px}p{color:#5b6475}a{color:#1f6f5c}</style></head>
<body><div class="c"><h1 id="t">Opening your school&rsquo;s Sarparast&hellip;</h1><p id="m">One moment.</p></div>
<script>
(function () {
  var roles = { parent: 1, student: 1, staff: 1 };
  var role = new URLSearchParams(location.search).get('role');
  if (!roles[role]) role = '';
  function fail() {
    document.getElementById('t').textContent = 'The school is offline right now';
    document.getElementById('m').innerHTML = 'The school computer may be switched off or not connected. Please try again later.<br><a href="">Try again</a>';
  }
  function go(j) {
    if (!j || !/^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(j.url)) return fail();
    location.replace(j.url + '/#/login' + (role ? '?role=' + role : ''));
  }
  // The freshest copy is on GitHub's file server; if it is slow, use the copy beside this page.
  var get = function (u, ms) {
    var c = new AbortController(); setTimeout(function () { c.abort(); }, ms);
    return fetch(u + '?t=' + Date.now(), { cache: 'no-store', signal: c.signal }).then(function (r) { if (!r.ok) throw 0; return r.json(); });
  };
  get('https://raw.githubusercontent.com/babarsultan009/sarparast/main/docs/s/aff5f8f796/link.json', 4000).catch(function () { return get('link.json', 10000); }).then(go).catch(fail);
})();
</script></body></html>
